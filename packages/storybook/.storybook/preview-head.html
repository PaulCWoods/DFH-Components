<style>
  /* 1. Base Preview Canvas & Iframe */
  html,
  body {
    background-color: var(--surface);
    color: var(--foreground);
    font-family: var(--body-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    margin: 0;
    transition: background-color var(--duration-sm, 0.2s) ease, color var(--duration-sm, 0.2s) ease;
  }

  /* 3. Story Preview Canvas Card in Docs View */
  .docs-story,
  .sb-story,
  .sbdocs-preview,
  .innerZoomElementWrapper {
    background-color: var(--surface-card);
    color: var(--foreground);
  }

  /* Outer border container wrapping the preview story block */
  div:has(> .docs-story),
  div:has(> .innerZoomElementWrapper),
  div:has(> div > .docs-story) {
    background-color: var(--surface-card);
    border-color: var(--border-muted);
  }

  /* 4. Controls / ArgsTable */
  .docblock-argstable {
    color: var(--foreground);
    background-color: var(--surface-card);
    border-color: var(--border-muted);
  }

  .docblock-argstable-head th {
    color: var(--foreground);
    background-color: var(--surface-card);
    border-color: var(--border-muted);
  }

  .docblock-argstable-body tr {
    background-color: var(--surface-card);
    border-color: var(--border-muted);
    color: var(--foreground);
  }

  .docblock-argstable-body tr:nth-of-type(2n) {
    background-color: var(--surface-fade);
  }

  .docblock-argstable-body td {
    color: var(--foreground);
    border-color: var(--border-muted);
  }

  .docblock-argstable-body td span,
  .docblock-argstable-body td code {
    color: var(--foreground);
  }

  /* Table inputs and control fields */
  .docblock-argstable input,
  .docblock-argstable select,
  .docblock-argstable textarea {
    color: var(--foreground);
    background-color: var(--surface);
    border-color: var(--border-muted);
  }

  /* Show code toggle button */
  .docblock-code-toggle {
    background-color: var(--surface-card);
    color: var(--foreground);
    border-color: var(--border-muted);
  }

  /* Code snippet block in docs */
  .docblock-source {
    border-color: var(--border-muted);
  }
</style>
